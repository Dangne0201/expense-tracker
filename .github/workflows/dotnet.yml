name: .NET

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-unit-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ExpenseTracker.sln

      - name: Build solution
        run: dotnet build ExpenseTracker.sln --configuration Release --no-restore

      - name: Run database-independent tests
        run: dotnet test src/ExpenseTracker.Tests/ExpenseTracker.Tests.csproj --configuration Release --no-build --filter "Category!=Integration" --verbosity normal
