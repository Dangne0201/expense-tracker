services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: "${EXPENSE_TRACKER_CONTAINER_NAME:-expense-mssql}"
    user: "0:0"
    entrypoint: ["/bin/bash", "-c"]
    command: ["if [ \"$(stat -c '%U' /var/opt/mssql/data)\" != \"mssql\" ]; then chown -R mssql:0 /var/opt/mssql/data; fi && exec su -s /bin/bash mssql -c '/opt/mssql/bin/permissions_check.sh /opt/mssql/bin/sqlservr'"]
    environment:
      SA_PASSWORD: "${SA_PASSWORD:?Set SA_PASSWORD in the process environment or local .env file}"
      ACCEPT_EULA: "Y"
    ports:
      - "127.0.0.1:${EXPENSE_TRACKER_SQL_PORT:-1433}:1433"
    volumes:
      - mssqldata:/var/opt/mssql/data
      - ./data/init.sql:/init/init.sql:ro
      # Using Docker-managed named volume 'mssqldata' for SQL Server data to avoid host-bind permission issues on Windows; this keeps data persistent across container restarts without binding to host paths.
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/1433' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mssqldata: {}
# 'mssqldata' is a Docker-managed named volume (no host path). This avoids Windows host ACL problems; Docker will manage the storage location.
